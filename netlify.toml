[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # NEXT_PUBLIC_* values are public by design and are built into the site.
  # Placeholder values (MUX_WEBHOOK_SECRET=temp) can also match ordinary text.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_SITE_URL,MUX_WEBHOOK_SECRET"
